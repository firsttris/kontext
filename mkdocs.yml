# Documentation as a website: https://firsttris.github.io/kontext/
# Source is docs/, built with MkDocs Material (.github/workflows/docs.yml publishes it).
# Locally: pip install mkdocs-material mkdocs-static-i18n && mkdocs serve
# Languages: German at /, English at /en/. A page is translated by a file next to it with .en.md
# (index.en.md); a page without one shows the German text in the English site too.
site_name: Kontext
site_description: >-
  Mail, Kalender, Kontakte, Aufgaben, Team-Chat und Telefonie (CTI) auf dem eigenen Server – die
  selbst gehostete Alternative zu Google Workspace und Microsoft 365, mit Stalwart als Mailserver.
site_author: Tristan Teufel
site_url: https://firsttris.github.io/kontext/
repo_url: https://github.com/firsttris/kontext
repo_name: firsttris/kontext
edit_uri: edit/main/docs/
copyright: Lizenz AGPL-3.0 · © Tristan Teufel und Mitwirkende
# Pages as mail.html instead of mail/: keeps the relative image paths right, which also have to
# work on GitHub
use_directory_urls: false
# Links to headings that don't exist fail the strict build
validation:
  anchors: warn
theme:
  name: material
  # Link previews for pages with an image (overrides/main.html)
  custom_dir: overrides
  language: de
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle: { icon: material/weather-night, name: Dunkel }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle: { icon: material/weather-sunny, name: Hell }
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: de
          name: Deutsch
          default: true
        - locale: en
          name: English
          site_description: >-
            Mail, calendar, contacts, tasks, team chat and telephony (CTI) on your own server – the
            self-hosted alternative to Google Workspace and Microsoft 365, with Stalwart as the
            mail server.
          nav_translations:
            Start: Home
            Überblick: Overview
            Funktionen: Features
            Kalender und Kontakte: Calendar and contacts
            Aufgaben: Tasks
            Team-Chat und Videocalls: Team chat and video calls
            Telefonie (CTI): Telephony (CTI)
            Dokumente: Documents
            Verschlüsselung: Encryption
            KI-Agenten (MCP): AI agents (MCP)
            Firmenverwaltung und Umzug: Company admin and migration
            App, Handy und Konto: App, phone and account
            Betrieb: Running it
            VPS einrichten: Setting up a VPS
            Technik: How it is built
            Architektur: Architecture
            Entwicklung: Development
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
extra_css:
  - assets/entdecken.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/firsttris/kontext
      name: Quellcode auf GitHub
nav:
  - Start: index.md
  - Überblick: ueberblick.md
  - Funktionen:
      - Mail: mail.md
      - Kalender und Kontakte: calendar-contacts.md
      - Aufgaben: tasks.md
      - Team-Chat und Videocalls: chat.md
      - Telefonie (CTI): telephony.md
      - Dokumente: documents.md
      - Verschlüsselung: encryption.md
      - KI-Agenten (MCP): agents.md
      - Firmenverwaltung und Umzug: company.md
      - App, Handy und Konto: app.md
      - Barrierefreiheit: accessibility.md
  - Betrieb:
      - VPS einrichten: vps.md
      - Installation: installation.md
  - Technik:
      - Architektur: architecture.md
      - Entwicklung: development.md
