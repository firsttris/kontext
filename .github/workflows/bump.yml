name: Bump version

# The button for a new version (Actions → Bump version → Run workflow on main): raises the version
# in package.json, commits it as "Release vX.Y.Z", tags it and starts release.yml on the tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
        default: patch

jobs:
  bump:
    uses: firsttris/workflows/.github/workflows/bump-version.yml@v1
    with:
      bump: ${{ inputs.bump }}
    permissions:
      contents: write
      actions: write
