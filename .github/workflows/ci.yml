name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  # Nightly: new advisories for dependencies show up without a push.
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx biome ci .
      - run: bun run test
      - run: bun run build
      # Known vulnerabilities in dependencies (high and critical fail the build).
      # GHSA-86w9-cpqp-85rv (node-forge <= 1.4.0, no fixed release yet) is in forge's RSA
      # signature check, which Kontext does not use: S/MIME signatures are checked by WebCrypto
      # in the browser (src/lib/smime.ts) and by node:crypto on the server (server/smime).
      - run: bun audit --audit-level=high --ignore GHSA-86w9-cpqp-85rv

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict

  box:
    name: Telephone box image (Asterisk + agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f box/Dockerfile -t kontext-box .
      # Asterisk starts with PJSIP and the manager, the agent serves its status page.
      - run: docker run -d --name box --network host kontext-box
      - run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8089/ | grep -q "Kontext-Telefonbox" && break; sleep 1; done
          curl -fsS http://127.0.0.1:8089/ | grep -q "noch nicht mit Kontext gekoppelt"
          docker exec box asterisk -rx "module show like res_pjsip.so" | grep -q "res_pjsip.so"
          docker exec box asterisk -rx "manager show users" | grep -q "kontext-agent"
      # Everything the agent may write, with every feature on: Asterisk must read all of it.
      - run: |
          docker run --rm -v "$PWD":/src -w /src docker.io/oven/bun:1.4-alpine \
            bun box/sample-config.ts /src/.box-sample
          docker cp .box-sample/pjsip.conf box:/etc/asterisk/pjsip.conf
          docker cp .box-sample/extensions.conf box:/etc/asterisk/extensions.conf
          docker exec box asterisk -rx "core reload"
          sleep 2
          for context in kontext-in kontext-mailbox kontext-record kontext-hold kontext-resume kontext-out kontext-ended kontext-out-ended; do
            docker exec box asterisk -rx "dialplan show $context" | grep -q "\[ Context '$context'" || { echo "missing $context"; exit 1; }
          done
          docker exec box asterisk -rx "dialplan show ring@kontext-in" | grep -q "GotoIfTime"
          docker exec box asterisk -rx "pjsip show endpoints" | grep -q "fritzbox-anna"
          docker exec box asterisk -rx "moh show classes" | grep -q "Class: default"
      - if: always()
        run: docker logs box || true

  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.playwright.outputs.image }}
    steps:
      - id: playwright
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  e2e:
    name: End-to-end tests (Stalwart + Playwright)
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # The npm package brings the binary without curl or unzip, which the image lacks
      - run: npm install --global bun@1.4.x
      # readpst for the Outlook move (server/migration/pst.ts)
      - run: apt-get update && apt-get install -y --no-install-recommends pst-utils
      - uses: actions/cache@v4
        with:
          path: .dev/bin
          key: stalwart-${{ hashFiles('dev/config.ts') }}
      - run: bun install --frozen-lockfile
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
