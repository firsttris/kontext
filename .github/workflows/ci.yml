name: CI

# Text only (Markdown, docs/, the license) changes no code: no run. docs.yml checks docs/.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_call: # release.yml runs the same checks before publishing
  workflow_dispatch:
  # Nightly: new advisories for dependencies show up without a push.
  schedule:
    - cron: "17 3 * * *"

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx biome ci .
      - run: bun run test
      - run: bun run build
      # The demo on GitHub Pages (src/demo); published by the docs workflow after the merge.
      - run: bun run build:demo
      # Known vulnerabilities in dependencies (high and critical fail the build).
      # GHSA-86w9-cpqp-85rv (node-forge <= 1.4.0, no fixed release yet) is in forge's RSA
      # signature check, which Kontext does not use: S/MIME signatures are checked by WebCrypto
      # in the browser (src/lib/smime.ts) and by node:crypto on the server (server/smime).
      - run: bun audit --audit-level=high --ignore GHSA-86w9-cpqp-85rv

  box:
    name: Telephone box image (Asterisk + agent)
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f box/Dockerfile -t kontext-box .
      # Asterisk starts with PJSIP and the manager, the agent serves its status page.
      - run: docker run -d --name box --network host kontext-box
      - run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8089/ | grep -q "Kontext-Telefonbox" && break; sleep 1; done
          curl -fsS http://127.0.0.1:8089/ | grep -q "noch nicht mit Kontext gekoppelt"
          docker exec box asterisk -rx "module show like res_pjsip.so" | grep -q "res_pjsip.so"
          docker exec box asterisk -rx "manager show users" | grep -q "kontext-agent"
          # The agent reloads Asterisk over AMI after each configuration: that needs "command"
          docker exec box asterisk -rx "manager show user kontext-agent" | grep -q "write perm:.*command"
          # Every module the box loads loads cleanly (box/asterisk/modules.conf)
          if docker logs box 2>&1 | grep -E "Error loading module|declined to load|Failed to resolve dependencies"; then exit 1; fi
      # Everything the agent may write, with every feature on: Asterisk must read all of it.
      - run: |
          fail() { echo "::error::$1"; failed=1; }
          failed=0
          docker run --rm -v "$PWD":/src -w /src docker.io/oven/bun:1.4-alpine \
            bun box/sample-config.ts /src/.box-sample || fail "sample config not written"
          docker cp .box-sample/pjsip.conf box:/etc/asterisk/pjsip.conf
          docker cp .box-sample/extensions.conf box:/etc/asterisk/extensions.conf
          docker exec box asterisk -rx "core reload"
          sleep 3
          for context in kontext-in kontext-mailbox kontext-record kontext-hold kontext-resume kontext-out kontext-ended kontext-out-ended kontext-desk kontext-answered-here; do
            docker exec box asterisk -rx "dialplan show $context" | grep -q "Context '$context'" || fail "dialplan: $context missing"
          done
          docker exec box asterisk -rx "dialplan show ring@kontext-in" | grep -q "GotoIfTime" || fail "dialplan: no opening hours"
          docker exec box asterisk -rx "pjsip show endpoints" | grep -q "fritzbox-anna" || fail "pjsip: extra line missing"
          docker exec box asterisk -rx "pjsip show endpoints" | grep -q "desk-empfang" || fail "pjsip: desk phone missing"
          docker exec box asterisk -rx "moh show classes" | grep -q "Class: default" || fail "music on hold: no class ($(docker exec box sh -c 'ls /usr/share/asterisk/moh | head -5; asterisk -rx "module show like musiconhold"' | tr '\n' ' '))"
          exit $failed
      - if: always()
        run: docker logs box || true

  image:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.playwright.outputs.image }}
    steps:
      - id: playwright
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  # The end-to-end tests in four parts at once, each with a Stalwart and seed of its own (the tests
  # share one server within a part and run one after the other there). Playwright splits by files,
  # so a file whose tests build on each other (e2e/phone.spec.ts) stays in one part.
  e2e:
    name: End-to-end tests (${{ matrix.shard }}/4)
    needs: image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: ${{ needs.image.outputs.image }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      # The npm package brings the binary without curl or unzip, which the image lacks
      - run: npm install --global bun@1.4.x
      # readpst for the Outlook move (server/migration/pst.ts); its packages are kept, so only the
      # first run after a new image asks the package index (apt-get update takes the time).
      - uses: actions/cache@v6
        with:
          path: .dev/apt
          key: pst-utils-${{ needs.image.outputs.image }}
      - run: |
          if ! ls .dev/apt/*.deb > /dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends --download-only pst-utils
            mkdir -p .dev/apt
            cp /var/cache/apt/archives/*.deb .dev/apt/
          fi
          dpkg -i .dev/apt/*.deb
          command -v readpst
      - uses: actions/cache@v6
        with:
          path: .dev/bin
          key: stalwart-${{ hashFiles('dev/config.ts') }}
      - run: bun install --frozen-lockfile
      # Nightly each test runs three times and without the retry, so one that passes only now and
      # then shows up there before it holds up a pull request.
      - run: >-
          bun run e2e --shard=${{ matrix.shard }}/4
          ${{ github.event_name == 'schedule' && '--repeat-each=3 --retries=0' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # One check under the old name for all parts, for branch rules and a quick look.
  e2e-all:
    name: End-to-end tests (Stalwart + Playwright)
    needs: e2e
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e.result }}" = success
