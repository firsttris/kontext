name: Update video

on:
  workflow_dispatch:

jobs:
  video:
    uses: firsttris/workflows/.github/workflows/screenshots.yml@v1
    with:
      # ffmpeg encodes the film; in a container without sudo apt-get runs as root.
      command: >-
        (command -v ffmpeg || (sudo -n true 2>/dev/null && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) || (apt-get update -qq && apt-get install -y -qq ffmpeg))
        && bun run video
      install: bun install --frozen-lockfile
      bun: true
      bun-version: 1.4.x
      lockfile: bun.lock
      paths: docs/assets
    permissions:
      contents: write
