name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # A release commit from "Bump version" changes only the version, so main's green CI of the commit
  # before it counts and the checks are not run a second time.
  tested:
    uses: firsttris/workflows/.github/workflows/tested-on-main.yml@v1
    permissions:
      actions: read
      contents: read

  checks:
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml

  docker:
    needs: [tested, checks]
    # The checks either passed or were not needed
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    uses: firsttris/workflows/.github/workflows/docker-release.yml@v1
    with:
      image: tristanteu/kontext
      description: Self-hosted office suite for small businesses – mail, calendar and contacts on Stalwart
      ghcr: true
    secrets: inherit
    permissions:
      contents: write
      packages: write

  # The telephone box (Asterisk and the box agent), its own image: tristanteu/kontext-box.
  box:
    needs: docker
    # Without its own condition the job is skipped with "checks" further up (v0.1.2, v0.1.3)
    if: ${{ !cancelled() && needs.docker.result == 'success' }}
    uses: firsttris/workflows/.github/workflows/docker-release.yml@v1
    with:
      image: tristanteu/kontext-box
      description: Kontext telephone box – Asterisk and the box agent, next to the Fritzbox
      dockerfile: box/Dockerfile
      readme: ""
      # Its own build cache (ghcr.io/firsttris/kontext-box-buildcache), not the app image's, and no
      # second GitHub release: the app image's call creates it.
      ghcr-image: firsttris/kontext-box
      github-release: false
    secrets: inherit
    permissions:
      contents: write
      packages: write

  # deploy/.env.example and the Quadlet unit name a fixed image version; after the images are out,
  # they point at this one (v0.1.4 and v0.1.5 still said 0.1.3). A commit with GITHUB_TOKEN starts
  # no further workflow.
  deploy-version:
    needs: [docker, box]
    if: ${{ !cancelled() && needs.docker.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point deploy/ at the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^KONTEXT_VERSION=.*/KONTEXT_VERSION=$version/" deploy/.env.example
          sed -i "s#^Image=docker.io/tristanteu/kontext:.*#Image=docker.io/tristanteu/kontext:$version#" \
            deploy/quadlet/kontext.container
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: images of v$version"
          git push origin HEAD:main
