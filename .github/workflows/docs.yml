# Builds docs/ with MkDocs Material and the demo (src/demo, `bun run build:demo`) and publishes
# both on GitHub Pages: https://firsttris.github.io/kontext/ and …/kontext/demo/
# On a push to main it runs for every change, as the demo is the app; on a pull request it only
# builds the docs (--strict), so broken links show up before the merge – CI builds the app.
# One-time prerequisite: Settings → Pages → Source "GitHub Actions"
# (configure-pages with enablement switches it on by itself on the first run).
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material mkdocs-static-i18n
      - run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - if: github.event_name != 'pull_request'
        run: bun install --frozen-lockfile && bun run build:demo && cp -r dist-demo site/demo
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
