# Kontext for one customer: Stalwart (mail, calendar, contacts), the Kontext server (app,
# sign-in, JMAP pass-through), Caddy (HTTPS), with the profile "calls" LiveKit for calls in the
# chat plus LiveKit SIP and Redis for telephony through the telephone box, and with the profile
# "documents" Schreibzeug for documents (COMPOSE_PROFILES in .env).
# Works with Docker Compose and Podman Compose; Quadlet files are in deploy/quadlet/.
#
#   cp deploy/.env.example deploy/.env   # fill in domain and mail
#   docker compose -f deploy/compose.yaml up -d
name: kontext

services:
  stalwart:
    image: docker.io/stalwartlabs/stalwart:v0.16.27
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      # Stalwart's own admin, only on the server itself (SSH tunnel) or its Tailscale address
      - "${TAILSCALE_IP:-127.0.0.1}:8080:8080"
    volumes:
      - stalwart-config:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    environment:
      STALWART_HOSTNAME: ${STALWART_HOSTNAME}
      STALWART_PUBLIC_URL: https://${KONTEXT_DOMAIN}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  kontext:
    image: docker.io/tristanteu/kontext:${KONTEXT_VERSION:?KONTEXT_VERSION in deploy/.env setzen}
    restart: unless-stopped
    depends_on: [stalwart]
    environment:
      STALWART_URL: http://stalwart:8080
      BETTER_AUTH_URL: https://${KONTEXT_DOMAIN}
      BETTER_AUTH_SECRET: ${KONTEXT_SECRET:?KONTEXT_SECRET in deploy/.env setzen}
      STALWART_ADMIN_KEY: ${STALWART_ADMIN_KEY:-}
      # Calls in the chat; without a secret they are off.
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: kontext
      LIVEKIT_API_SECRET: ${LIVEKIT_SECRET:-}
      # Documents (Schreibzeug); without the address the module is off.
      SCHREIBZEUG_URL: ${SCHREIBZEUG_URL:-}
      SCHREIBZEUG_CLIENT_SECRET: ${SCHREIBZEUG_CLIENT_SECRET:-}
      # Place suggestions for an appointment's "Ort" (Photon); set but empty turns them off.
      PLACES_URL: ${PLACES_URL-https://photon.komoot.io/api/}
    volumes:
      - kontext-data:/data

  # Documents: a service of its own with its own data and versions. People sign in through
  # Kontext (OpenID Connect); its tokens let Kontext move attachments in and out.
  schreibzeug:
    image: docker.io/tristanteu/schreibzeug:${SCHREIBZEUG_VERSION:-latest}
    profiles: [documents]
    restart: unless-stopped
    depends_on: [kontext]
    environment:
      SCHREIBZEUG_URL: ${SCHREIBZEUG_URL:-}
      SCHREIBZEUG_EMBED_ORIGIN: https://${KONTEXT_DOMAIN}
      # Caddy, as Schreibzeug sees it (the network below): without it every sign-in counts as
      # Caddy's, and all of them share the few tries per client (docs/installation.md there)
      SCHREIBZEUG_TRUSTED_PROXIES: 10.89.250.0/24
      OIDC_ISSUER: https://${KONTEXT_DOMAIN}/api/auth
      OIDC_CLIENT_ID: schreibzeug
      OIDC_CLIENT_SECRET: ${SCHREIBZEUG_CLIENT_SECRET:-}
    volumes:
      - schreibzeug-data:/data

  livekit:
    image: docker.io/livekit/livekit-server:v1.13.11
    profiles: [calls]
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--udp-port", "7882"]
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "kontext: ${LIVEKIT_SECRET:-}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # Telephony: the telephone box at the customer calls in here (SIP over TCP 5060, media on UDP
  # 20000–20100); LiveKit SIP puts the calls into LiveKit rooms. It talks to LiveKit over Redis.
  livekit-sip:
    image: docker.io/livekit/sip:v1.21.0
    profiles: [calls]
    restart: unless-stopped
    depends_on: [redis, livekit]
    ports:
      - "5060:5060/tcp"
      - "20000-20100:20000-20100/udp"
    environment:
      SIP_CONFIG_BODY: |
        api_key: kontext
        api_secret: ${LIVEKIT_SECRET:-}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 20000-20100
        use_external_ip: true
        # The boxes sit behind the customers' routers: answer media where it comes from.
        symmetric_rtp: true
        # Unknown callers get no answer at all, so port scanners learn nothing.
        hide_inbound_port: true
        logging:
          level: warn

  redis:
    image: docker.io/library/redis:7.4.5-alpine
    profiles: [calls]
    restart: unless-stopped
    # Only rooms and calls in flight; nothing to keep across a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  caddy:
    image: docker.io/library/caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on: [kontext]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KONTEXT_DOMAIN: ${KONTEXT_DOMAIN}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL}
      SCHREIBZEUG_URL: ${SCHREIBZEUG_URL:-https://schreibzeug.internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  stalwart-config:
  stalwart-data:
  kontext-data:
  schreibzeug-data:
  caddy-data:
  caddy-config:

# A fixed subnet, so it can be entered in Stalwart as an allowed network (installation, step 3):
# Kontext signs everyone in from this one address, and Stalwart would otherwise ban it after
# 100 failed logins a day – for good, and for everyone.
networks:
  default:
    ipam:
      config:
        - subnet: 10.89.250.0/24
