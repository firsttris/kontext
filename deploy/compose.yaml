# Kontext for one customer: Stalwart (mail, calendar, contacts), the Kontext server (app,
# sign-in, JMAP pass-through), Caddy (HTTPS) and, with the profile "calls", LiveKit for calls in
# the chat plus LiveKit SIP and Redis for telephony through the telephone box
# (COMPOSE_PROFILES=calls in .env).
# Works with Docker Compose and Podman Compose; Quadlet files are in deploy/quadlet/.
#
#   cp deploy/.env.example deploy/.env   # fill in domain and mail
#   docker compose -f deploy/compose.yaml up -d
name: kontext

services:
  stalwart:
    image: docker.io/stalwartlabs/stalwart:v0.16.27
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      # Stalwart's own admin, only on the server's Tailscale address
      - "${TAILSCALE_IP:-127.0.0.1}:8080:8080"
    volumes:
      - stalwart-config:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    environment:
      STALWART_HOSTNAME: ${STALWART_HOSTNAME}
      STALWART_PUBLIC_URL: https://${KONTEXT_DOMAIN}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  kontext:
    image: docker.io/tristanteu/kontext:${KONTEXT_VERSION:-latest}
    restart: unless-stopped
    depends_on: [stalwart]
    environment:
      STALWART_URL: http://stalwart:8080
      BETTER_AUTH_URL: https://${KONTEXT_DOMAIN}
      BETTER_AUTH_SECRET: ${KONTEXT_SECRET}
      STALWART_ADMIN_KEY: ${STALWART_ADMIN_KEY:-}
      # Calls in the chat; without a secret they are off.
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: kontext
      LIVEKIT_API_SECRET: ${LIVEKIT_SECRET:-}
    volumes:
      - kontext-data:/data

  livekit:
    image: docker.io/livekit/livekit-server:v1.13.10
    profiles: [calls]
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--udp-port", "7882"]
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "kontext: ${LIVEKIT_SECRET:-}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # Telephony: the telephone box at the customer calls in here (SIP over TCP 5060, media on UDP
  # 20000–20100); LiveKit SIP puts the calls into LiveKit rooms. It talks to LiveKit over Redis.
  livekit-sip:
    image: docker.io/livekit/sip:v1.21.0
    profiles: [calls]
    restart: unless-stopped
    depends_on: [redis, livekit]
    ports:
      - "5060:5060/tcp"
      - "20000-20100:20000-20100/udp"
    environment:
      SIP_CONFIG_BODY: |
        api_key: kontext
        api_secret: ${LIVEKIT_SECRET:-}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 20000-20100
        use_external_ip: true
        # The boxes sit behind the customers' routers: answer media where it comes from.
        symmetric_rtp: true
        # Unknown callers get no answer at all, so port scanners learn nothing.
        hide_inbound_port: true
        logging:
          level: warn

  redis:
    image: docker.io/library/redis:7-alpine
    profiles: [calls]
    restart: unless-stopped
    # Only rooms and calls in flight; nothing to keep across a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    depends_on: [kontext]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KONTEXT_DOMAIN: ${KONTEXT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  stalwart-config:
  stalwart-data:
  kontext-data:
  caddy-data:
  caddy-config:
